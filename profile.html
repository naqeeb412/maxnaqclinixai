<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الملف الشخصي — NAQClinixAI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif;background:#f0f2f5}</style>
</head>
<body class="min-h-screen p-4">

<div id="loadingScreen" class="fixed inset-0 bg-gradient-to-br from-blue-900 to-teal-600 flex items-center justify-center z-50">
  <div class="text-white text-center"><div class="text-6xl mb-4">👤</div><div class="text-xl font-bold">جاري التحميل...</div></div>
</div>

<div class="max-w-2xl mx-auto">
  <div class="bg-gradient-to-r from-blue-900 to-teal-600 text-white rounded-2xl p-5 mb-4 flex justify-between items-center">
    <h1 class="text-xl font-extrabold">👤 الملف الشخصي</h1>
    <a href="clinical.html" class="bg-white/20 hover:bg-white/30 px-3 py-2 rounded-lg text-xs font-bold">← رجوع</a>
  </div>

  <div class="bg-white rounded-2xl shadow p-5">
    <div class="text-center mb-4">
      <img id="avatar" src="https://ui-avatars.com/api/?name=?" class="w-24 h-24 rounded-full mx-auto mb-2">
      <input type="file" id="avatarInput" accept="image/*" class="text-xs" onchange="updateAvatar()">
    </div>
    <div class="space-y-2">
      <label class="text-xs font-bold block">الاسم الكامل</label>
      <input type="text" id="pName" class="w-full p-2 border rounded-lg text-sm">
      <label class="text-xs font-bold block">الهاتف</label>
      <input type="tel" id="pPhone" class="w-full p-2 border rounded-lg text-sm">
      <label class="text-xs font-bold block">السيرة/التخصص</label>
      <textarea id="pBio" rows="3" class="w-full p-2 border rounded-lg text-sm"></textarea>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="pShowEmail"> إظهار الإيميل للعامة</label>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="pShowPhone"> إظهار الهاتف للعامة</label>
      <button onclick="saveProfile()" class="bg-blue-600 text-white w-full p-2 rounded-lg font-bold">💾 حفظ التغييرات</button>
      <p id="msg" class="hidden text-xs text-center p-2 rounded-lg font-bold"></p>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBe5PoeoH0pJ9hC0vTjVPELNZPpmKqCjCU",
  authDomain: "naqclinixai-dental-clinic.firebaseapp.com",
  projectId: "naqclinixai-dental-clinic",
  storageBucket: "naqclinixai-dental-clinic.firebasestorage.app",
  messagingSenderId: "796796158387",
  appId: "1:796796158387:web:613eac60fa6bc18e60cbc6"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let currentData = null;

auth.onAuthStateChanged(async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  currentUser = user;
  const doc = await db.collection('users').doc(user.uid).get();
  currentData = doc.data() || {};
  document.getElementById('pName').value = currentData.name || '';
  document.getElementById('pPhone').value = currentData.phone || '';
  document.getElementById('pBio').value = currentData.bio || '';
  document.getElementById('pShowEmail').checked = currentData.privacy?.showEmail || false;
  document.getElementById('pShowPhone').checked = currentData.privacy?.showPhone || false;
  document.getElementById('avatar').src = currentData.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentData.name || 'User')}&background=1877f2&color=fff`;
  document.getElementById('loadingScreen').style.display = 'none';
});

async function saveProfile() {
  try {
    await db.collection('users').doc(currentUser.uid).update({
      name: document.getElementById('pName').value.trim(),
      phone: document.getElementById('pPhone').value.trim(),
      bio: document.getElementById('pBio').value.trim(),
      privacy: {
        showEmail: document.getElementById('pShowEmail').checked,
        showPhone: document.getElementById('pShowPhone').checked
      }
    });
    showMsg('✅ تم الحفظ', 'success');
  } catch (e) { showMsg('❌ ' + e.message, 'error'); }
}

async function updateAvatar() {
  const file = document.getElementById('avatarInput').files[0];
  if (!file) return;
  // رفع الصورة (مؤقتاً: Base64)
  const reader = new FileReader();
  reader.onload = async (e) => {
    await db.collection('users').doc(currentUser.uid).update({ avatar: e.target.result });
    document.getElementById('avatar').src = e.target.result;
    alert('✅ تم تحديث الصورة');
  };
  reader.readAsDataURL(file);
}

function showMsg(text, type) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'text-xs text-center p-2 rounded-lg font-bold ' + (type === 'error' ? 'bg-red-50 text-red-600' : 'bg-emerald-50 text-emerald-700');
}
</script>
</body>
</html>
