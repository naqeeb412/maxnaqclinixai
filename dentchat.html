<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DentChat — الدردشة</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif;background:#f0f2f5}</style>
</head>
<body class="min-h-screen">

<div id="loadingScreen" class="fixed inset-0 bg-gradient-to-br from-blue-900 to-teal-600 flex items-center justify-center z-50">
  <div class="text-white text-center"><div class="text-6xl mb-4">💬</div><div class="text-xl font-bold">جاري التحميل...</div></div>
</div>

<header class="bg-gradient-to-r from-blue-900 to-teal-600 text-white p-3">
  <div class="max-w-4xl mx-auto flex justify-between items-center">
    <h1 class="font-bold">💬 DentChat</h1>
    <a href="clinical.html" class="bg-white/20 px-3 py-1 rounded-lg text-xs font-bold">← رجوع</a>
  </div>
</header>

<div class="max-w-4xl mx-auto p-3 grid md:grid-cols-3 gap-3">

  <div class="bg-white rounded-xl shadow p-3 md:col-span-1">
    <h2 class="font-bold text-sm mb-2">👥 المستخدمون</h2>
    <input type="text" id="searchUsers" placeholder="🔍 بحث..." class="w-full p-2 border rounded-lg text-xs mb-2">
    <div id="usersList" class="space-y-1 max-h-[60vh] overflow-y-auto"><div class="text-gray-400 text-center py-2 text-xs">جاري التحميل...</div></div>
  </div>

  <div class="bg-white rounded-xl shadow p-3 md:col-span-2 flex flex-col h-[70vh]">
    <div id="chatHeader" class="border-b pb-2 mb-2 font-bold text-sm text-blue-900">اختر مستخدماً للمحادثة</div>
    <div id="chatMessages" class="flex-1 overflow-y-auto space-y-2 mb-2"></div>
    <div class="flex gap-1">
      <input type="text" id="chatInput" placeholder="اكتب رسالة..." class="flex-1 p-2 border rounded-lg text-sm" onkeydown="if(event.key==='Enter')sendMessage()">
      <button onclick="sendMessage()" class="bg-blue-600 text-white px-3 py-2 rounded-lg text-sm font-bold">إرسال</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBe5PoeoH0pJ9hC0vTjVPELNZPpmKqCjCU",
  authDomain: "naqclinixai-dental-clinic.firebaseapp.com",
  projectId: "naqclinixai-dental-clinic",
  storageBucket: "naqclinixai-dental-clinic.firebasestorage.app",
  messagingSenderId: "796796158387",
  appId: "1:796796158387:web:613eac60fa6bc18e60cbc6"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let currentData = null;
let selectedUser = null;
let unsubscribeMessages = null;

auth.onAuthStateChanged(async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  currentUser = user;
  const doc = await db.collection('users').doc(user.uid).get();
  currentData = doc.data() || { name: user.email };
  document.getElementById('loadingScreen').style.display = 'none';
  loadUsers();
});

async function loadUsers() {
  try {
    const snap = await db.collection('users').get();
    const list = document.getElementById('usersList');
    list.innerHTML = '';
    snap.forEach(doc => {
      if (doc.id === currentUser.uid) return;
      const d = doc.data();
      const div = document.createElement('div');
      div.className = 'p-2 border rounded-lg cursor-pointer hover:bg-blue-50 text-sm';
      div.innerHTML = `<div class="font-bold">${d.name || d.email}</div><div class="text-xs text-gray-500">${d.role || ''}</div>`;
      div.onclick = () => openChat(doc.id, d.name || d.email);
      list.appendChild(div);
    });
  } catch (e) { console.error(e); }
}

function openChat(uid, name) {
  selectedUser = uid;
  document.getElementById('chatHeader').textContent = `💬 ${name}`;
  if (unsubscribeMessages) unsubscribeMessages();
  const chatId = [currentUser.uid, uid].sort().join('_');
  unsubscribeMessages = db.collection('chats').doc(chatId).collection('messages')
    .orderBy('timestamp', 'asc').onSnapshot(snap => {
      const container = document.getElementById('chatMessages');
      container.innerHTML = '';
      snap.forEach(doc => {
        const m = doc.data();
        const isMe = m.from === currentUser.uid;
        const div = document.createElement('div');
        div.className = `p-2 rounded-lg text-sm max-w-[70%] ${isMe ? 'bg-blue-100 ml-auto' : 'bg-gray-100'}`;
        div.textContent = m.text;
        container.appendChild(div);
      });
      container.scrollTop = container.scrollHeight;
    });
}

async function sendMessage() {
  if (!selectedUser) return alert('اختر مستخدماً أولاً');
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  const chatId = [currentUser.uid, selectedUser].sort().join('_');
  try {
    await db.collection('chats').doc(chatId).collection('messages').add({
      from: currentUser.uid,
      fromName: currentData.name,
      text: text,
      timestamp: new Date()
    });
    input.value = '';
  } catch (e) { alert('خطأ: ' + e.message); }
}
</script>
</body>
</html>
