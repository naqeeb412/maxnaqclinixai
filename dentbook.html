<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dentbook — منصة الأطباء</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
    /* نفس الأنماط التي أرسلتها سابقاً — لا تغيير */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: #f0f2f5; color: #1c1e21; padding-top: 60px; }
    .dentbook-header { position: fixed; top: 0; right: 0; left: 0; height: 56px; background: #fff; border-bottom: 1px solid #d0d1d5; display: flex; align-items: center; padding: 0 16px; z-index: 1000; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .header-inner { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 1200px; margin: 0 auto; }
    .logo-area { display: flex; align-items: center; gap: 8px; }
    .logo-text { font-size: 22px; font-weight: bold; color: #1877f2; }
    .search-area { background: #f0f2f5; border-radius: 20px; padding: 6px 14px; display: flex; align-items: center; gap: 8px; flex: 1; max-width: 500px; margin: 0 20px; }
    .search-area input { border: none; background: transparent; outline: none; width: 100%; font-size: 14px; }
    .header-actions { display: flex; align-items: center; gap: 16px; }
    .profile-icon img { border-radius: 50%; width: 36px; height: 36px; object-fit: cover; cursor: pointer; }
    .dentbook-main { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 240px 1fr 280px; gap: 20px; }
    .left-sidebar, .right-sidebar { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); height: fit-content; }
    .sidebar-menu { list-style: none; }
    .sidebar-menu li { padding: 10px 12px; border-radius: 8px; display: flex; align-items: center; gap: 12px; font-size: 14px; cursor: pointer; transition: background 0.15s; }
    .sidebar-menu li:hover { background: #f0f2f5; }
    .sidebar-menu li.active { background: #e7f3ff; color: #1877f2; font-weight: 600; }
    .create-post-card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 16px; }
    .create-post-top { display: flex; align-items: center; gap: 12px; }
    .create-post-top img { border-radius: 50%; width: 40px; height: 40px; }
    .create-post-top input { flex: 1; border: none; background: #f0f2f5; padding: 10px 14px; border-radius: 20px; font-size: 14px; outline: none; }
    .create-post-actions { display: flex; align-items: center; gap: 20px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #e4e6eb; flex-wrap: wrap; }
    .publish-btn { background: #1877f2; color: #fff; border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-right: auto; }
    .publish-btn:hover { background: #166fe5; }
    .publish-btn:disabled { background: #ccc; cursor: not-allowed; }
    .post-card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 16px; }
    .post-header { display: flex; align-items: center; gap: 12px; }
    .post-header img { border-radius: 50%; width: 44px; height: 44px; object-fit: cover; }
    .post-author-info h4 { font-size: 15px; margin: 0; }
    .post-author-info .post-title { font-size: 12px; color: #606770; }
    .post-content { margin: 12px 0 10px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
    .post-stats { display: flex; justify-content: space-between; font-size: 13px; color: #606770; border-bottom: 1px solid #e4e6eb; padding-bottom: 8px; margin-bottom: 8px; }
    .post-actions { display: flex; justify-content: space-around; flex-wrap: wrap; }
    .post-actions button { background: none; border: none; padding: 8px 16px; font-size: 14px; color: #606770; cursor: pointer; display: flex; align-items: center; gap: 6px; border-radius: 6px; transition: background 0.15s; }
    .post-actions button:hover { background: #f0f2f5; }
    .post-actions .liked { color: #1877f2; font-weight: bold; }
    .comments-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid #e4e6eb; display: none; }
    .comments-section.show { display: block; }
    .comment-item { display: flex; gap: 10px; margin-bottom: 8px; font-size: 14px; }
    .comment-item img { border-radius: 50%; width: 28px; height: 28px; }
    .comment-item .comment-body { background: #f0f2f5; padding: 6px 12px; border-radius: 16px; flex: 1; }
    .comment-input-area { display: flex; gap: 8px; margin-top: 6px; }
    .comment-input-area input { flex: 1; border: 1px solid #e4e6eb; border-radius: 20px; padding: 6px 14px; outline: none; font-size: 14px; }
    .comment-input-area button { background: #1877f2; color: #fff; border: none; padding: 6px 16px; border-radius: 20px; cursor: pointer; }
    #authGuard { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; }
    .empty-state { text-align: center; padding: 40px; color: #606770; }
    .loading { text-align: center; padding: 40px; color: #1877f2; }
    @media (max-width: 992px) { .dentbook-main { grid-template-columns: 1fr; } .left-sidebar, .right-sidebar { display: none; } }
</style>
</head>
<body>

<div id="authGuard">
    <div style="text-align:center">
        <i class="fas fa-lock" style="font-size:48px;margin-bottom:16px"></i>
        <p>يجب تسجيل الدخول أولاً...</p>
        <p style="font-size:14px;margin-top:12px;opacity:0.7">جاري التحقق من الهوية</p>
    </div>
</div>

<header class="dentbook-header">
    <div class="header-inner">
        <div class="logo-area">
            <i class="fas fa-tooth" style="color:#1877f2; font-size:28px;"></i>
            <span class="logo-text">Dentbook</span>
        </div>
        <div class="search-area">
            <i class="fas fa-search"></i>
            <input type="text" id="globalSearch" placeholder="ابحث في Dentbook..." />
        </div>
        <div class="header-actions">
            <div class="profile-icon">
                <img id="userAvatar" src="https://ui-avatars.com/api/?name=?&background=1877f2&color=fff&size=32" alt="صورة شخصية" />
            </div>
        </div>
    </div>
</header>

<main class="dentbook-main">
    <aside class="left-sidebar">
        <ul class="sidebar-menu">
            <li class="active"><i class="fas fa-home"></i> الرئيسية</li>
            <li id="logoutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</li>
        </ul>
    </aside>

    <section class="feed-column">
        <div class="create-post-card">
            <div class="create-post-top">
                <img id="posterAvatar" src="https://ui-avatars.com/api/?name=?&background=1877f2&color=fff&size=40" alt="صورة" />
                <input type="text" id="postInput" placeholder="ماذا تريد مشاركته مع زملائك؟" />
            </div>
            <div class="create-post-actions">
                <span><i class="fas fa-image" style="color:#45bd62;"></i> صورة</span>
                <span><i class="fas fa-video" style="color:#f7b928;"></i> فيديو</span>
                <button id="publishPostBtn" class="publish-btn">نشر</button>
            </div>
        </div>
        <div id="postsContainer" class="posts-container">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> جاري تحميل المنشورات...</div>
        </div>
    </section>

    <aside class="right-sidebar">
        <h4 style="margin-bottom:12px"><i class="fas fa-user"></i> مرحباً</h4>
        <div id="userInfo" style="font-size:14px;line-height:1.8"></div>
    </aside>
</main>

<script>
// ✅ مشروع العيادة
const firebaseConfig = {
  apiKey: "AIzaSyBe5PoeoH0pJ9hC0vTjVPELNZPpmKqCjCU",
  authDomain: "naqclinixai-dental-clinic.firebaseapp.com",
  projectId: "naqclinixai-dental-clinic",
  storageBucket: "naqclinixai-dental-clinic.firebasestorage.app",
  messagingSenderId: "796796158387",
  appId: "1:796796158387:web:613eac60fa6bc18e60cbc6"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let currentUserData = null;
let unsubscribePosts = null;

auth.onAuthStateChanged(async (user) => {
    if (!user) {
        document.getElementById('authGuard').innerHTML = `
            <div style="text-align:center">
                <i class="fas fa-lock" style="font-size:48px;margin-bottom:16px"></i>
                <p>يجب تسجيل الدخول أولاً</p>
                <a href="login.html" style="display:inline-block;margin-top:16px;background:#1877f2;color:#fff;padding:10px 24px;border-radius:8px;text-decoration:none;font-weight:bold">تسجيل الدخول</a>
            </div>`;
        return;
    }
    currentUser = user;
    document.getElementById('authGuard').style.display = 'none';

    const userDoc = await db.collection('users').doc(user.uid).get();
    if (userDoc.exists) {
        currentUserData = userDoc.data();
    } else {
        currentUserData = { name: user.displayName || user.email.split('@')[0], email: user.email };
        await db.collection('users').doc(user.uid).set({
            ...currentUserData, uid: user.uid, role: 'doctor', createdAt: new Date()
        }, { merge: true });
    }

    const avatar = currentUserData.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUserData.name)}&background=1877f2&color=fff`;
    document.getElementById('userAvatar').src = avatar;
    document.getElementById('posterAvatar').src = avatar;
    document.getElementById('userInfo').innerHTML = `<strong>${currentUserData.name}</strong><br><span style="color:#606770">${currentUserData.email}</span>`;

    loadPosts();
});

async function loadPosts() {
    const container = document.getElementById('postsContainer');
    if (unsubscribePosts) unsubscribePosts();

    unsubscribePosts = db.collection('dentbook_posts')
        .orderBy('timestamp', 'desc').limit(50)
        .onSnapshot(snapshot => {
            if (snapshot.empty) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox" style="font-size:48px;margin-bottom:12px;color:#ccc"></i><p>لا توجد منشورات بعد</p><p style="font-size:13px;margin-top:8px">كن أول من ينشر!</p></div>';
                return;
            }
            container.innerHTML = '';
            snapshot.forEach(doc => container.appendChild(createPostElement(doc.id, doc.data())));
        }, err => {
            container.innerHTML = '<div class="empty-state" style="color:#e41e3f"><p>خطأ: ' + err.message + '</p></div>';
        });
}

function createPostElement(id, post) {
    const div = document.createElement('div');
    div.className = 'post-card';
    div.dataset.id = id;
    const likes = post.likes || [];
    const comments = post.comments || [];
    const hasLiked = likes.includes(currentUser.uid);
    const avatar = post.authorAvatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(post.authorName || 'User')}&background=1877f2&color=fff`;
    const time = post.timestamp ? new Date(post.timestamp.seconds * 1000).toLocaleString('ar') : 'الآن';

    div.innerHTML = `
        <div class="post-header">
            <img src="${avatar}" alt="${post.authorName}" />
            <div class="post-author-info"><h4>${post.authorName || 'مستخدم'}</h4><div class="post-title">${time}</div></div>
        </div>
        <div class="post-content">${escapeHtml(post.text || '')}</div>
        <div class="post-stats">
            <span><i class="fas fa-thumbs-up"></i> ${likes.length}</span>
            <span><i class="fas fa-comment"></i> ${comments.length}</span>
        </div>
        <div class="post-actions">
            <button class="like-btn ${hasLiked ? 'liked' : ''}" data-id="${id}"><i class="${hasLiked ? 'fas' : 'far'} fa-thumbs-up"></i> ${hasLiked ? 'تم الإعجاب' : 'إعجاب'}</button>
            <button class="comment-toggle" data-id="${id}"><i class="far fa-comment"></i> تعليق</button>
        </div>
        <div class="comments-section" id="comments-${id}">
            <div class="comments-list" id="commentsList-${id}">
                ${comments.map(c => `<div class="comment-item"><img src="${c.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(c.name || 'U') + '&background=1877f2&color=fff'}" /><div class="comment-body"><strong>${escapeHtml(c.name || 'مستخدم')}</strong> ${escapeHtml(c.text || '')}</div></div>`).join('')}
            </div>
            <div class="comment-input-area">
                <input type="text" class="comment-input" placeholder="اكتب تعليقاً..." data-id="${id}" />
                <button class="comment-submit" data-id="${id}">نشر</button>
            </div>
        </div>
    `;
    return div;
}

document.getElementById('publishPostBtn').addEventListener('click', async () => {
    const input = document.getElementById('postInput');
    const text = input.value.trim();
    if (!text) return alert('اكتب شيئاً أولاً');
    const btn = document.getElementById('publishPostBtn');
    btn.disabled = true; btn.textContent = 'جاري النشر...';
    try {
        await db.collection('dentbook_posts').add({
            authorId: currentUser.uid,
            authorName: currentUserData.name,
            authorEmail: currentUserData.email,
            authorAvatar: currentUserData.avatar || '',
            text: text,
            likes: [],
            comments: [],
            shares: 0,
            timestamp: new Date()
        });
        input.value = '';
    } catch (e) { alert('خطأ: ' + e.message); }
    btn.disabled = false; btn.textContent = 'نشر';
});

document.addEventListener('click', async (e) => {
    const likeBtn = e.target.closest('.like-btn');
    if (likeBtn) {
        const id = likeBtn.dataset.id;
        const ref = db.collection('dentbook_posts').doc(id);
        const snap = await ref.get();
        if (!snap.exists) return;
        const likes = snap.data().likes || [];
        const idx = likes.indexOf(currentUser.uid);
        if (idx >= 0) likes.splice(idx, 1); else likes.push(currentUser.uid);
        await ref.update({ likes });
        return;
    }
    const commentToggle = e.target.closest('.comment-toggle');
    if (commentToggle) {
        document.getElementById('comments-' + commentToggle.dataset.id).classList.toggle('show');
        return;
    }
    const commentSubmit = e.target.closest('.comment-submit');
    if (commentSubmit) {
        const id = commentSubmit.dataset.id;
        const input = document.querySelector(`.comment-input[data-id="${id}"]`);
        const text = input.value.trim();
        if (!text) return;
        const ref = db.collection('dentbook_posts').doc(id);
        const snap = await ref.get();
        if (!snap.exists) return;
        const comments = snap.data().comments || [];
        comments.push({ uid: currentUser.uid, name: currentUserData.name, avatar: currentUserData.avatar || '', text, timestamp: Date.now() });
        await ref.update({ comments });
        input.value = '';
        return;
    }
});

document.getElementById('globalSearch').addEventListener('input', function() {
    const term = this.value.toLowerCase().trim();
    document.querySelectorAll('.post-card').forEach(card => {
        card.style.display = !term || card.querySelector('.post-content').textContent.toLowerCase().includes(term) ? '' : 'none';
    });
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
    if (confirm('تسجيل الخروج؟')) { await auth.signOut(); window.location.href = 'login.html'; }
});

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
