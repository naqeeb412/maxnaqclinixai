<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاشتراكات — NAQClinixAI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif;background:#f0f2f5}</style>
</head>
<body class="min-h-screen p-4">

<div id="loadingScreen" class="fixed inset-0 bg-gradient-to-br from-blue-900 to-teal-600 flex items-center justify-center z-50">
  <div class="text-white text-center"><div class="text-6xl mb-4">💳</div><div class="text-xl font-bold">جاري التحميل...</div></div>
</div>

<div class="max-w-3xl mx-auto">
  <div class="bg-gradient-to-r from-blue-900 to-teal-600 text-white rounded-2xl p-5 mb-4 flex justify-between items-center">
    <h1 class="text-xl font-extrabold">💳 الاشتراكات</h1>
    <a href="clinical.html" class="bg-white/20 px-3 py-2 rounded-lg text-xs font-bold">← رجوع</a>
  </div>

  <div id="plansContainer" class="grid md:grid-cols-2 gap-3 mb-4">
    <div class="text-gray-400 text-center py-8 col-span-2">جاري التحميل...</div>
  </div>

  <div id="paymentSection" class="bg-white rounded-2xl shadow p-5 hidden">
    <h2 class="font-bold text-blue-900 mb-3">💳 إتمام الاشتراك</h2>
    <div class="space-y-2">
      <div class="bg-yellow-50 border border-yellow-300 p-3 rounded-lg text-sm">
        <strong>طريقة الدفع:</strong> تحويل يدوي إلى محفظة Binance USDT (شبكة TRC20)
      </div>
      <div class="bg-gray-50 p-3 rounded-lg text-sm" dir="ltr" id="walletBox"></div>
      <input type="text" id="txHash" placeholder="رقم المعاملة (TX Hash) أو رقم إشعار التحويل" class="w-full p-2 border rounded-lg text-sm" dir="ltr">
      <textarea id="paymentNotes" placeholder="ملاحظات إضافية" rows="2" class="w-full p-2 border rounded-lg text-sm"></textarea>
      <button onclick="submitPayment()" class="bg-emerald-600 text-white w-full p-2 rounded-lg font-bold">📤 إرسال طلب التفعيل</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBe5PoeoH0pJ9hC0vTjVPELNZPpmKqCjCU",
  authDomain: "naqclinixai-dental-clinic.firebaseapp.com",
  projectId: "naqclinixai-dental-clinic",
  storageBucket: "naqclinixai-dental-clinic.firebasestorage.app",
  messagingSenderId: "796796158387",
  appId: "1:796796158387:web:613eac60fa6bc18e60cbc6"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let selectedPlan = null;

auth.onAuthStateChanged(async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  currentUser = user;
  document.getElementById('loadingScreen').style.display = 'none';
  loadPlans();
});

async function loadPlans() {
  try {
    const snap = await db.collection('subscription_plans').where('active', '==', true).get();
    const container = document.getElementById('plansContainer');
    if (snap.empty) { container.innerHTML = '<div class="text-gray-400 text-center py-8 col-span-2">لا توجد خطط متاحة</div>'; return; }
    container.innerHTML = '';
    snap.forEach(doc => {
      const d = doc.data();
      const div = document.createElement('div');
      div.className = 'bg-white rounded-xl shadow p-4 border-2 border-transparent hover:border-blue-500 cursor-pointer';
      div.innerHTML = `
        <div class="text-lg font-extrabold text-blue-900">${d.name}</div>
        <div class="text-2xl font-bold text-emerald-600 mt-1">${d.price} ${d.currency}</div>
        <div class="text-xs text-gray-500 mt-2">⏱️ ${d.duration} يوم</div>
        <ul class="text-xs text-gray-600 mt-2 space-y-1">${(d.content || []).map(c => '<li>• ' + c + '</li>').join('')}</ul>
        <button class="w-full bg-blue-600 text-white mt-3 p-2 rounded-lg font-bold">اشترك الآن</button>
      `;
      div.querySelector('button').onclick = () => selectPlan(doc.id, d);
      container.appendChild(div);
    });
  } catch (e) { console.error(e); }
}

function selectPlan(id, plan) {
  selectedPlan = { id, ...plan };
  document.getElementById('paymentSection').classList.remove('hidden');
  document.getElementById('walletBox').innerHTML = `
    <strong>المبلغ:</strong> ${plan.price} ${plan.currency}<br>
    <strong>عنوان المحفظة (TRC20):</strong><br>
    <code class="bg-white p-1 rounded block mt-1">${plan.binanceWallet || 'لم يتم إعداده'}</code>
  `;
  document.getElementById('paymentSection').scrollIntoView({ behavior: 'smooth' });
}

async function submitPayment() {
  const txHash = document.getElementById('txHash').value.trim();
  const notes = document.getElementById('paymentNotes').value.trim();
  if (!txHash) return alert('أدخل رقم المعاملة');
  try {
    await db.collection('subscription_requests').add({
      userId: currentUser.uid,
      userEmail: currentUser.email,
      planId: selectedPlan.id,
      planName: selectedPlan.name,
      amount: selectedPlan.price,
      currency: selectedPlan.currency,
      method: 'binance_usdt_trc20',
      txHash: txHash,
      notes: notes,
      status: 'pending',
      createdAt: new Date()
    });
    alert('✅ تم إرسال الطلب — سيتم مراجعته من قبل الإدارة');
    document.getElementById('paymentSection').classList.add('hidden');
  } catch (e) { alert('خطأ: ' + e.message); }
}
</script>
</body>
</html>
